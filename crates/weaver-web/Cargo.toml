[package]
name = "weaver-web"
version = "0.1.0"
# **Pinned rather than inherited, and the alignment is owed.** The workspace
# is edition 2024 and this crate pins 2021. The migration is real work - the
# sqlx and askama derives are where an edition move bites. The tree first
# resolved and built 2026-08-25 from this crate's own lockfile (the crate is
# excluded from the workspace members - see the workspace Cargo.toml), so
# the alignment act is unblocked and remains its own act. Held at the Spec's
# section 15.
edition = "2021"
default-run = "weaver-web"
# **Explicit rather than inherited, because the licences disagree.** The
# workspace publishes nothing and carries UNLICENSED. This crate carries
# Apache-2.0 with its LICENSE file beside it. The suite's licence boundary
# is an open operator question, held rather than resolved by inheritance,
# per the Spec's section 15.
license = "Apache-2.0"
publish = false
description = "The WeaverTools suite's frontend: channel, lifecycle, and trace surfaces over weaver agents."

# **The first database dependency in this workspace, and it is this crate's
# alone.** A frontend holding its own store is ordinary, and nothing else in
# the workspace carries one. Whether the tree now has a database, or whether
# this stays a property of one member, is held at the Spec's section 15.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
askama = "0.14"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
