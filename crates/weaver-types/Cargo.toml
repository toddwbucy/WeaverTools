[package]
name = "weaver-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The floor's data definitions: the agent config, the identity pair, and the loop 0 wire vocabulary"

# The dependency set is four crates, one of them optional, per weaver-types-Spec
# section 1: weaver-traits as the one floor-link, serde for the config and wire
# types both, serde_json for the wire encoding, and a maintained YAML
# implementation behind the non-default config feature. serde_yaml_ng is the
# maintained continuation of the archived serde_yaml, confirmed at the moment of
# writing this manifest, per the Spec's section 6 election.
[dependencies]
weaver-traits = { path = "../weaver-traits" }
serde.workspace = true
# raw_value gates the splicing type section 4.4's measurement crosses as, per
# weaver-types-Spec section 1: pre-serialized JSON written in place, never a
# quoted string.
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng = { version = "0.10", optional = true }

[features]
config = ["dep:serde_yaml_ng"]

[dev-dependencies]
