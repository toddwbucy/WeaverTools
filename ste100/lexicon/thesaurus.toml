# STE100 thesaurus for software text: how to write the verbs that software engineers
# use most and that STE100 does not approve. Candidate, unratified; written in our own
# words. Whether a word is approved is from the operator's local copy of the standard;
# no text of the standard is copied here. The verbs we admit as technical verbs are in
# technical-verbs.toml; computing verbs that may become technical verbs (return, raise,
# ...) are in the 2026-11-01 synonym check and are not here. call is ruled out (call ->
# use, operator 2026-11-01).
#
# Order: by how often the 2026-11-01 pilot failed on the verb (pilot_hits, all
# attempts); entries added on 2026-11-01 for hedges count the pilot segments that hold
# the word (pilot_inputs). Each sense gives approved words to use and one rewrite. Words that look
# safe but are not approved: successful, failure, now, already, old, say. Every "after" is
# checked by tests/test_ste_thesaurus.py with scripts/ste_check.py.

[call]
note = "Operator ruling, 2026-11-01: not admitted as a technical verb. Fixed mapping."
[[call.senses]]
sense = "make code run a function, a method or an API"
use = ["use"]
before = "The handler calls [[C1]] with the raw bytes."
after = "The handler uses [[C1]] with the raw bytes."

[fix]
pilot_hits = 10794
[[fix.senses]]
sense = "make code or a defect correct"
use = ["repair", "correct (v)"]
before = "Let me fix the bug in the parser."
after = "I will repair the error in the parser."
[[fix.senses]]
sense = "the result: a problem no longer occurs"
use = ["repaired", "does not occur"]
before = "The issue is fixed."
after = "The issue does not occur at this time."

[exist]
pilot_hits = 7340
[[exist.senses]]
sense = "be present"
use = ["there is", "is in", "has"]
before = "A test for this already exists."
after = "The repository has a test for this."

[expect]
pilot_hits = 5372
[[expect.senses]]
sense = "the result that is correct or wanted"
use = ["correct result", "must"]
before = "The expected output is an empty list."
after = "The correct output is an empty list."
[[expect.senses]]
sense = "a prediction"
use = ["will", "possibly"]
before = "I expect this test to fail."
after = "Possibly, this test will give an incorrect result."

[pass]
pilot_hits = 4618
[[pass.senses]]
sense = "a test is successful (passing an argument is a computing sense, see the synonym check)"
use = ["give the correct result"]
before = "All tests pass."
after = "All tests give the correct result."

[should]
pilot_hits = 4228
note = "Operator ruling, 2026-11-01: three senses. must only for a requirement or a correct value."
[[should.senses]]
sense = "advice: a recommended action (you should add a test, it is better to)"
use = ["I recommend that", "we recommend"]
before = "You should add a regression test."
after = "I recommend that you add a test for the regression."
[[should.senses]]
sense = "expectation: a probable result (this should fix it)"
use = ["I think that", "possibly"]
before = "This should fix the error."
after = "I think that this change will repair the error."
[[should.senses]]
sense = "requirement or correct value (X should be Y, no error should be raised)"
use = ["must"]
before = "No error should be raised."
after = "The code must not give an error."

[suggest]
pilot_inputs = 544
note = "Candidate, 2026-11-01. Not in the dictionary. Evidence that points to a conclusion is not proof: never write shows."
[[suggest.senses]]
sense = "evidence points to a conclusion (this suggests that)"
use = ["this is an indication that", "possibly"]
before = "This suggests the cache is stale."
after = "This is an indication that the cache is not current."

[seem]
pilot_inputs = 692
note = "Candidate, 2026-11-01. Not in the dictionary."
[[seem.senses]]
sense = "it looks true, but it is not certain"
use = ["possibly", "it is possible that", "I think that"]
before = "The error seems unrelated to the change."
after = "Possibly, the error is not related to the change."

[might]
pilot_inputs = 910
note = "Candidate, 2026-11-01. Not in the dictionary. Also for maybe and perhaps (389 pilot segments)."
[[might.senses]]
sense = "a possibility"
use = ["possibly", "it is possible that"]
before = "The test might fail on Windows."
after = "Possibly, the test will give an incorrect result on Windows."

[probably]
pilot_inputs = 150
note = "Candidate, 2026-11-01. Not in the dictionary, and STE has no approved word for this degree of certainty; I think that is the candidate (needs a ruling). Also for likely (199 pilot segments)."
[[probably.senses]]
sense = "a probable result, stronger than possible"
use = ["I think that"]
before = "The bug is probably in the parser."
after = "I think that the error is in the parser."

[create]
pilot_hits = 3687
[[create.senses]]
sense = "make a file, an object or a test (class 2 of the 2026-10-31 check)"
use = ["make"]
before = "Let me create a test script."
after = "I will make a test script."

[fail]
pilot_hits = 2865
[[fail.senses]]
sense = "a test or an operation is not successful"
use = ["gives an incorrect result", "does not give the correct result"]
before = "The test fails on Windows."
after = "The test gives an incorrect result on Windows."

[need]
pilot_hits = 2544
[[need.senses]]
sense = "a requirement"
use = ["must", "is necessary"]
before = "We need to update the docs."
after = "It is necessary to change the documentation."

[happen]
pilot_hits = 2088
[[happen.senses]]
sense = "an event takes place"
use = ["occur"]
before = "The error happens when the list is empty."
after = "The error occurs when the list is empty."

[place]
pilot_hits = 1900
[[place.senses]]
sense = "put something in a position"
use = ["put"]
before = "Place the check before the loop."
after = "Put the check before the loop."

[describe]
pilot_hits = 1676
[[describe.senses]]
sense = "the issue or a document gives information"
