  <text x="1240" y="880" font-size="36" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPU</text>
  <text x="1240" y="926" font-size="26" fill="#555555" text-anchor="middle">decoder built, encoder declared</text>
  <text x="1240" y="964" font-size="24" fill="#2f6b3f" text-anchor="middle">minimum core</text>

  <rect x="1450" y="800" width="300" height="210" fill="#ffffff" stroke="#666666" stroke-width="5" stroke-dasharray="12,9"/>
  <text x="1600" y="880" font-size="36" font-weight="bold" fill="#333333" text-anchor="middle">MEMORY</text>
  <text x="1600" y="926" font-size="26" fill="#555555" text-anchor="middle">reasoning over time</text>
  <text x="1600" y="964" font-size="24" fill="#555555" text-anchor="middle">first extension</text>

  <rect x="1810" y="800" width="300" height="210" fill="#ffffff" stroke="#666666" stroke-width="5" stroke-dasharray="12,9"/>
  <text x="1960" y="872" font-size="34" font-weight="bold" fill="#333333" text-anchor="middle">PERCEPTION</text>
  <text x="1960" y="916" font-size="26" fill="#555555" text-anchor="middle">vision, audio</text>
  <text x="1960" y="954" font-size="24" fill="#555555" text-anchor="middle">later extension</text>

  <path d="M 1825 490 C 1960 520 2060 620 2125 672" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="2125" y="655" width="50" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="2175" y1="680" x2="2215" y2="680" stroke="#1a1a1a" stroke-width="4"/>

  <rect x="2215" y="565" width="230" height="230" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
  <text x="2330" y="655" font-size="36" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ADMIN</text>
  <text x="2330" y="700" font-size="25" fill="#555555" text-anchor="middle">turns the harness on,</text>
  <text x="2330" y="734" font-size="25" fill="#555555" text-anchor="middle">tees the trace</text>

  <line x1="2330" y1="795" x2="2330" y2="880" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <text x="2300" y="932" font-size="29" font-weight="bold" fill="#1a1a1a" text-anchor="middle">observability consumer</text>
  <text x="2300" y="972" font-size="24" fill="#555555" text-anchor="middle">where faithfulness is checked</text>

  <text x="385" y="1240" font-size="32" font-weight="bold" fill="#333333" text-anchor="middle">supplies material to reason over</text>
  <text x="385" y="1284" font-size="27" fill="#666666" text-anchor="middle">reached through the gate</text>
  <text x="385" y="1324" font-size="27" fill="#666666" text-anchor="middle">outside the loop, still part of the agent</text>

  <text x="1595" y="1240" font-size="32" font-weight="bold" fill="#2f6b3f" text-anchor="middle">directly enhances the processing of meaning</text>
  <text x="1595" y="1284" font-size="27" fill="#666666" text-anchor="middle">connects to the harness</text>

  <text x="75" y="1420" font-size="26" fill="#777777">Solid organs stand today. Dashed organs are admitted by the same criterion, not by a second rule. (Bucy, 2026)</text>
</svg>
