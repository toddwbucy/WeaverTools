[workspace]
resolver = "3"
members = ["crates/weaver-traits", "crates/weaver-types", "crates/weaver-trace", "crates/weaver-harness", "crates/weaver-internal", "crates/weaver-admin", "crates/weaver-spu", "crates/weaver-gate", "crates/weaver-state"]

# **`weaver-web` is in the tree and out of the workspace, and the reason is a
# collision rather than a judgment about the crate.** It depends on sqlx 0.8,
# which depends on sqlx-sqlite unconditionally whatever features are elected,
# and that pulls libsqlite3-sys. `weaver-state` reaches the same native
# library through rusqlite at a different version. Cargo permits one package
# linking `sqlite3` in a graph, so the two cannot resolve together and the
# whole workspace fails to build rather than only the crate that collides.
#
# Excluding it restores the build for every other crate and settles nothing:
# the absorption of 2026-08-24 said the deps were never resolved on the
# machine that ran it, and this records the same fact one level up. What the
# tree does about having two database stories is the operator's question, and
# the choices are aligning the two on one libsqlite3-sys, moving one of them
# off its driver, or leaving this crate built on its own.
exclude = ["crates/weaver-web"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
